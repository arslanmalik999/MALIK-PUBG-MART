<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALIK PUBG MART</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000428, #004e92);
      color: white;
      overflow-x: hidden;
      text-align: center;
    }

    h1 {
      animation: glow 2s ease-in-out infinite alternate;
      margin: 30px 0;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .service-button {
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .service-button:hover {
      transform: scale(1.1);
    }

    .service-button img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      border-radius: 10px;
    }

    .ratelist {
      display: none;
      margin-top: 20px;
    }

    .ratelist img {
      max-width: 90%;
      border: 2px solid white;
      border-radius: 10px;
    }

    .contact {
      margin-top: 40px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border-top: 1px solid #444;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      border-radius: 50%;
      padding: 15px;
      z-index: 1000;
      transition: transform 0.2s;
    }

    .whatsapp-button img {
      width: 30px;
      height: 30px;
    }

    .whatsapp-button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

      <img src="https://drive.google.com/uc?export=view&id=1s3dhkzNf4yHQ4zxnxWJH6m6kMVt6thxZ" alt="PUBG UC"/>

  </div>

  <div class="contact">
    <p>WhatsApp: 0305-7913067</p>
    <p>Email: arslanmm425@gmail.com</p>
  </div>

    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="Chat on WhatsApp">

  <script>
    function showRate(id) {
      const all = document.querySelectorAll('.ratelist');
      all.forEach(div => div.style.display = 'none');

    }
